<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Outer Gold Circle Border -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="url(#goldGrad)" stroke-width="4" />
  
  <!-- Background Filled Circle -->
  <circle cx="100" cy="100" r="88" fill="url(#bgGrad)" filter="url(#shadow)" />
  
  <!-- Inner Decorative Ring -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="#fef08a" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.6" />
  
  <!-- Fish Icon Graphic -->
  <g transform="translate(100, 85) scale(1.1)">
    <!-- Fish Body & Tail -->
    <path d="M-35,0 C-15,-25 25,-25 40,0 C25,25 -15,25 -35,0 Z" fill="url(#goldGrad)" />
    <!-- Tail Fin -->
    <path d="M35,0 L50,-18 L42,0 L50,18 Z" fill="url(#goldGrad)" />
    <!-- Eye -->
    <circle cx="-20" cy="-4" r="3.5" fill="#1c1917" />
    <!-- Flame accent above fish -->
    <path d="M-5,-15 C-2,-30 10,-35 15,-22 C18,-30 28,-28 22,-14 C28,-18 32,-10 26,-5 Z" fill="#fef08a" opacity="0.9" />
  </g>
  
  <!-- Brand Text Curve / Base -->
  <text x="100" y="152" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">MAMA OLIECH</text>
  <text x="100" y="168" font-family="sans-serif" font-size="8" font-weight="600" fill="#fef08a" text-anchor="middle" letter-spacing="2">EST. NAIROBI</text>
</svg>
